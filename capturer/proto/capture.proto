syntax = "proto3";

package capture_receiver;
option go_package = "github.com/nrf24l01/sniffly/capturer/proto;proto";

message Packet {
  string source_id = 1;
  bytes payload = 2;
  int64 timestamp = 3;
}

message PublishResponse {
  bool success = 1;
  string message_id = 2;
  string error = 3;
}

enum BlockRuleTargetType {
  BLOCK_RULE_TARGET_TYPE_UNSPECIFIED = 0;
  BLOCK_RULE_TARGET_TYPE_IP = 1;
  BLOCK_RULE_TARGET_TYPE_CIDR = 2;
  BLOCK_RULE_TARGET_TYPE_SNI = 3;
}

message GetBlockRulesRequest {}

message BlockRule {
  string id = 1;
  string device_id = 2;
  string device_mac = 3;
  string device_ip = 4;
  string device_label = 5;
  BlockRuleTargetType target_type = 6;
  string target_value = 7;
  bool enabled = 8;
}

message GetBlockRulesResponse {
  repeated BlockRule rules = 1;
  int64 generated_at = 2;
}

service PacketGateway {
  rpc PublishPacket(Packet) returns (PublishResponse);
  rpc StreamPackets(stream Packet) returns (stream PublishResponse);
  rpc GetBlockRules(GetBlockRulesRequest) returns (GetBlockRulesResponse);
}